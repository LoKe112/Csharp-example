name: CD

on:
  release:
    types: [published]
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR="/home/vboxuser/Desktop/Csharp-example"
            LOG_FILE="/home/vboxuser/Desktop/deploy.log"

            echo "=== DEPLOYMENT STARTED ===" > $LOG_FILE
            echo "Time: $(date)" >> $LOG_FILE

            cd "$APP_DIR"

            echo "📦 Pulling latest code..." | tee -a $LOG_FILE
            git pull origin Actions

            cd "ExampleWebService"

            echo "🔧 Building project..." | tee -a $LOG_FILE
            dotnet build --configuration Release >> $LOG_FILE 2>&1

            echo "🚀 Publishing project for Linux..." | tee -a $LOG_FILE
            dotnet publish --configuration Release --runtime linux-x64 --self-contained false -o publish >> $LOG_FILE 2>&1

            echo "✅ Starting application..." | tee -a $LOG_FILE
            # Останавливаем старый процесс, если есть
            pkill -f "dotnet ExampleWebService.dll" || true

            # Запускаем приложение в фоне
            dotnet publish/ExampleWebService.dll

            echo "🎉 DEPLOYMENT COMPLETED $(date)" | tee -a $LOG_FILE
